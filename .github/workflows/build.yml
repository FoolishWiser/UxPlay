name: Build Windows x64

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-ntldd
            base-devel

      - name: Configure CMake
        env:
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DNO_X11_DEPS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Verify binary
        run: |
          test -f build/uxplay.exe
          ls -la build/uxplay.exe
          ./build/uxplay.exe -zh -h 2>&1 | head -n 5 || true

      - name: Assemble portable bundle
        run: bash .github/scripts/win-bundle.sh ucrt64

      - name: Zip portable bundle
        shell: pwsh
        run: |
          $dir = Get-ChildItem dist -Directory | Select-Object -First 1
          $zip = "dist/$($dir.Name).zip"
          Compress-Archive -Path (Join-Path $dir.FullName '*') -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List Name, Length

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: uxplay-windows-ucrt64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download bundle
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "${GITHUB_REF_NAME}" artifacts/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "UxPlay 简体中文版 ${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md
